name: ci
on: [push, pull_request]
jobs:
  claims-api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/claims-api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt && pytest -q
  doc-service:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/doc-service } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.8" }
      - run: pip install -r requirements.txt && pytest -q
  member-portal:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/member-portal } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci && npm test
  terraform:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: infra } }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check && terraform init -backend=false && terraform validate
